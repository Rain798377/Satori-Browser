<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satori</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Kaisei+Opti:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ── SAKURA DARK — matches NEWTAB_THEMES.sakura exactly ── */
  :root {
    --bg:      #0d0a12;
    --bg2:     #150f1e;
    --bg3:     #1e1530;
    --accent:  #e8609a;
    --accent2: #f9c0d8;
    --text:    #f0e6ff;
    --text2:   #c4a8d4;
    --text3:   #7a6088;
    --border:  rgba(232,96,154,0.28);
    --card:    rgba(30,20,45,0.80);
    --petal:   #e8609a;

    /* transition helper — every themed element references this */
    --t: 0.45s ease;
  }

  [data-theme="light"] {
    --bg:      #faf5f7;
    --bg2:     #f0e8ef;
    --bg3:     #e8dce7;
    --accent:  #c0547e;
    --accent2: #a03868;
    --text:    #2a1a2e;
    --text2:   #6b4070;
    --text3:   #a888b0;
    --border:  rgba(192,84,126,0.20);
    --card:    rgba(255,248,253,0.85);
    --petal:   #d4789a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    /* smooth theme transitions on every element */
    transition:
      background-color var(--t),
      color var(--t);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background var(--t), color var(--t);
  }

  canvas#petals {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  .theme-toggle {
    position: fixed;
    top: 1.2rem; right: 1.5rem;
    z-index: 100;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2rem;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
    font-size: 0.75rem;
    color: var(--text2);
    letter-spacing: 0.08em;
    backdrop-filter: blur(8px);
    transition: all var(--t);
    font-family: inherit;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* theme badge — bottom right, shows active theme name */
  .theme-badge {
    position: fixed;
    bottom: 1.1rem; right: 1.5rem;
    z-index: 100;
    font-size: 0.65rem;
    color: var(--text3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color var(--t);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 2.5rem;
  }

  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }

  .clock {
    font-family: 'Kaisei Opti', serif;
    font-size: clamp(4rem, 10vw, 7rem);
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: center;
    transition: color var(--t);
  }

  .date {
    font-size: 0.85rem;
    color: var(--text2);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 300;
    transition: color var(--t);
  }

  .greeting {
    font-size: 0.9rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    font-weight: 300;
    transition: color var(--t);
  }

  .search-wrap {
    width: 100%;
    max-width: 560px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3rem;
    padding: 0.9rem 1.5rem 0.9rem 3rem;
    font-size: 0.95rem;
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    outline: none;
    backdrop-filter: blur(12px);
    transition:
      background var(--t),
      border-color var(--t),
      color var(--t),
      box-shadow var(--t);
  }

  .search-wrap input::placeholder { color: var(--text3); }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,96,154,0.15);
  }

  .search-icon {
    position: absolute;
    left: 1.1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 1rem;
    pointer-events: none;
    transition: color var(--t);
  }

  .widgets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    width: 100%;
    max-width: 860px;
  }

  .widget {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1.2rem;
    padding: 1.2rem 1.4rem;
    backdrop-filter: blur(12px);
    transition:
      background var(--t),
      border-color var(--t),
      transform 0.2s;
  }
  .widget:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .widget-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 0.6rem;
    transition: color var(--t);
  }

  .widget-value {
    font-size: 1.1rem;
    color: var(--text);
    font-weight: 400;
    transition: color var(--t);
  }

  .widget-sub {
    font-size: 0.78rem;
    color: var(--text2);
    margin-top: 0.2rem;
    transition: color var(--t);
  }

  .airing-grid {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .airing-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .airing-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    transition: background var(--t);
  }

  .airing-title {
    font-size: 0.8rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color var(--t);
  }

  .airing-ep {
    font-size: 0.72rem;
    color: var(--text3);
    margin-left: auto;
    flex-shrink: 0;
    transition: color var(--t);
  }

  .loading-text {
    font-size: 0.78rem;
    color: var(--text3);
    font-style: italic;
  }

  .shortcuts {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 560px;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    text-decoration: none;
    color: var(--text2);
    transition: color var(--t);
  }
  .shortcut:hover { color: var(--accent); }

  .shortcut-icon {
    width: 44px; height: 44px;
    border-radius: 0.8rem;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition:
      background var(--t),
      border-color var(--t),
      transform 0.2s;
  }
  .shortcut:hover .shortcut-icon {
    border-color: var(--accent);
    transform: scale(1.08);
  }

  .shortcut-name {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
  }

  .sakura-divider {
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.4em;
    opacity: 0.6;
    transition: color var(--t);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .top-section  { animation: fadeUp 0.6s ease both; }
  .search-wrap  { animation: fadeUp 0.6s 0.1s ease both; }
  .shortcuts    { animation: fadeUp 0.6s 0.2s ease both; }
  .widgets      { animation: fadeUp 0.6s 0.3s ease both; }
</style>
</head>
<body>

<canvas id="petals"></canvas>
<button class="theme-toggle" id="themeBtn">☀ light</button>
<div class="theme-badge" id="themeBadge">sakura</div>

<div class="container">
  <div class="top-section">
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date">Loading...</div>
    <div class="greeting" id="greeting">おかえり</div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" placeholder="Search or enter address..." id="searchInput" autofocus>
  </div>

  <div class="shortcuts">
    <a class="shortcut" href="https://myanimelist.net" target="_blank">
      <div class="shortcut-icon">🎌</div>
      <span class="shortcut-name">MAL</span>
    </a>
    <a class="shortcut" href="https://anilist.co" target="_blank">
      <div class="shortcut-icon">📺</div>
      <span class="shortcut-name">AniList</span>
    </a>
    <a class="shortcut" href="https://crunchyroll.com" target="_blank">
      <div class="shortcut-icon">🍥</div>
      <span class="shortcut-name">Crunchyroll</span>
    </a>
    <a class="shortcut" href="https://mangadex.org" target="_blank">
      <div class="shortcut-icon">📖</div>
      <span class="shortcut-name">MangaDex</span>
    </a>
    <a class="shortcut" href="https://jisho.org" target="_blank">
      <div class="shortcut-icon">辞</div>
      <span class="shortcut-name">Jisho</span>
    </a>
    <a class="shortcut" href="https://reddit.com/r/anime" target="_blank">
      <div class="shortcut-icon">🌸</div>
      <span class="shortcut-name">r/anime</span>
    </a>
  </div>

  <div class="sakura-divider" id="divider">— 🌸 —</div>

  <div class="widgets">
    <div class="widget">
      <div class="widget-label">Currently Airing</div>
      <div class="airing-grid" id="airingGrid">
        <div class="loading-text">Fetching season...</div>
      </div>
    </div>

    <div class="widget">
      <div class="widget-label">Current Season</div>
      <div class="widget-value" id="seasonName">—</div>
      <div class="widget-sub" id="seasonCount">Loading from AniList...</div>
    </div>

    <div class="widget">
      <div class="widget-label">Quick Notes</div>
      <textarea id="notepad" placeholder="jot something down..." style="
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: inherit;
        font-size: 0.82rem;
        width: 100%;
        min-height: 70px;
        resize: none;
        line-height: 1.6;
        transition: color 0.45s ease;
      "></textarea>
    </div>
  </div>
</div>

<script src="newtab.js"></script>
</body>
</html>
