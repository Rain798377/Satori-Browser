<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Satori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Kaisei+Opti:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c14;
    --bg2: #12131f;
    --bg3: #1a1b2e;
    --accent: #e8a0bf;
    --accent2: #c97bb2;
    --text: #ede8f5;
    --text2: #a89bc2;
    --text3: #6b6080;
    --border: rgba(232,160,191,0.12);
    --card: rgba(26,27,46,0.8);
    --petal: #e8a0bf;
  }

  [data-theme="light"] {
    --bg: #faf5f7;
    --bg2: #f0e8ef;
    --bg3: #e8dce7;
    --accent: #c0547e;
    --accent2: #a03868;
    --text: #2a1a2e;
    --text2: #6b4070;
    --text3: #a888b0;
    --border: rgba(192,84,126,0.15);
    --card: rgba(255,248,253,0.85);
    --petal: #d4789a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
  }

  canvas#petals {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
  }

  .theme-toggle {
    position: fixed;
    top: 1.2rem; right: 1.5rem;
    z-index: 100;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2rem;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
    font-size: 0.75rem;
    color: var(--text2);
    letter-spacing: 0.08em;
    backdrop-filter: blur(8px);
    transition: all 0.3s;
    font-family: inherit;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 2.5rem;
  }

  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }

  .clock {
    font-family: 'Kaisei Opti', serif;
    font-size: clamp(4rem, 10vw, 7rem);
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: center;
  }

  .date {
    font-size: 0.85rem;
    color: var(--text2);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 300;
  }

  .greeting {
    font-size: 0.9rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    font-weight: 300;
  }

  .search-wrap {
    width: 100%;
    max-width: 560px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3rem;
    padding: 0.9rem 1.5rem 0.9rem 3rem;
    font-size: 0.95rem;
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    outline: none;
    backdrop-filter: blur(12px);
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .search-wrap input::placeholder { color: var(--text3); }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,160,191,0.1);
  }

  .search-icon {
    position: absolute;
    left: 1.1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 1rem;
    pointer-events: none;
  }

  .widgets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    width: 100%;
    max-width: 860px;
  }

  .widget {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1.2rem;
    padding: 1.2rem 1.4rem;
    backdrop-filter: blur(12px);
    transition: border-color 0.3s, transform 0.2s;
  }
  .widget:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .widget-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 0.6rem;
  }

  .widget-value {
    font-size: 1.1rem;
    color: var(--text);
    font-weight: 400;
  }

  .widget-sub {
    font-size: 0.78rem;
    color: var(--text2);
    margin-top: 0.2rem;
  }

  .airing-grid {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .airing-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .airing-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .airing-title {
    font-size: 0.8rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .airing-ep {
    font-size: 0.72rem;
    color: var(--text3);
    margin-left: auto;
    flex-shrink: 0;
  }

  .loading-text {
    font-size: 0.78rem;
    color: var(--text3);
    font-style: italic;
  }

  .shortcuts {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 560px;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    text-decoration: none;
    color: var(--text2);
    transition: color 0.2s;
  }
  .shortcut:hover { color: var(--accent); }

  .shortcut-icon {
    width: 44px; height: 44px;
    border-radius: 0.8rem;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: border-color 0.2s, transform 0.2s;
  }
  .shortcut:hover .shortcut-icon {
    border-color: var(--accent);
    transform: scale(1.08);
  }

  .shortcut-name {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
  }

  .sakura-divider {
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.4em;
    opacity: 0.5;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .top-section { animation: fadeUp 0.6s ease both; }
  .search-wrap { animation: fadeUp 0.6s 0.1s ease both; }
  .shortcuts { animation: fadeUp 0.6s 0.2s ease both; }
  .widgets { animation: fadeUp 0.6s 0.3s ease both; }
</style>
</head>
<body>

<canvas id="petals"></canvas>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀ light</button>

<div class="container">
  <div class="top-section">
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date">Loading...</div>
    <div class="greeting" id="greeting">おかえり</div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" placeholder="Search or enter address..." id="searchInput" onkeydown="handleSearch(event)" autofocus>
  </div>

  <div class="shortcuts">
    <a class="shortcut" href="https://myanimelist.net" target="_blank">
      <div class="shortcut-icon">🎌</div>
      <span class="shortcut-name">MAL</span>
    </a>
    <a class="shortcut" href="https://anilist.co" target="_blank">
      <div class="shortcut-icon">📺</div>
      <span class="shortcut-name">AniList</span>
    </a>
    <a class="shortcut" href="https://crunchyroll.com" target="_blank">
      <div class="shortcut-icon">🍥</div>
      <span class="shortcut-name">Crunchyroll</span>
    </a>
    <a class="shortcut" href="https://mangadex.org" target="_blank">
      <div class="shortcut-icon">📖</div>
      <span class="shortcut-name">MangaDex</span>
    </a>
    <a class="shortcut" href="https://jisho.org" target="_blank">
      <div class="shortcut-icon">辞</div>
      <span class="shortcut-name">Jisho</span>
    </a>
    <a class="shortcut" href="https://reddit.com/r/anime" target="_blank">
      <div class="shortcut-icon">🌸</div>
      <span class="shortcut-name">r/anime</span>
    </a>
  </div>

  <div class="sakura-divider">— 🌸 —</div>

  <div class="widgets">
    <div class="widget">
      <div class="widget-label">Currently Airing</div>
      <div class="airing-grid" id="airingGrid">
        <div class="loading-text">Fetching season...</div>
      </div>
    </div>

    <div class="widget">
      <div class="widget-label">Current Season</div>
      <div class="widget-value" id="seasonName">—</div>
      <div class="widget-sub" id="seasonCount">Loading from AniList...</div>
    </div>

    <div class="widget">
      <div class="widget-label">Quick Notes</div>
      <textarea id="notepad" placeholder="jot something down..." style="
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: inherit;
        font-size: 0.82rem;
        width: 100%;
        min-height: 70px;
        resize: none;
        line-height: 1.6;
      "></textarea>
    </div>
  </div>
</div>

<script>
  const greetings = ['おかえり', 'いらっしゃい', 'ようこそ', 'お疲れ様'];

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = h + ':' + m;

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('date').textContent =
      days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();

    const g = greetings[Math.floor(now.getMinutes() / 15) % greetings.length];
    document.getElementById('greeting').textContent = g;
  }

  updateClock();
  setInterval(updateClock, 1000);

  function handleSearch(e) {
    if (e.key !== 'Enter') return;
    const val = document.getElementById('searchInput').value.trim();
    if (!val) return;
    if (val.startsWith('http') || val.includes('.') && !val.includes(' ')) {
      window.location.href = val.startsWith('http') ? val : 'https://' + val;
    } else {
      window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
    }
  }

  let isDark = true;
  function toggleTheme() {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '☀ light' : '☽ dark';
    localStorage.setItem('satori-theme', isDark ? 'dark' : 'light');
  }

  const saved = localStorage.getItem('satori-theme');
  if (saved === 'light') toggleTheme();

  function getSeason() {
    const m = new Date().getMonth() + 1;
    if (m >= 1 && m <= 3) return { name: 'Winter', season: 'WINTER' };
    if (m >= 4 && m <= 6) return { name: 'Spring', season: 'SPRING' };
    if (m >= 7 && m <= 9) return { name: 'Summer', season: 'SUMMER' };
    return { name: 'Fall', season: 'FALL' };
  }

  async function fetchAiring() {
    const year = new Date().getFullYear();
    const { name, season } = getSeason();
    document.getElementById('seasonName').textContent = name + ' ' + year;

    const query = `{
      Page(page: 1, perPage: 8) {
        media(season: ${season}, seasonYear: ${year}, type: ANIME, sort: POPULARITY_DESC, status: RELEASING) {
          title { romaji }
          nextAiringEpisode { episode }
        }
      }
    }`;

    try {
      const res = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      const shows = data.data.Page.media;
      document.getElementById('seasonCount').textContent = shows.length + ' shows loaded';

      const grid = document.getElementById('airingGrid');
      grid.innerHTML = shows.slice(0, 5).map(s => `
        <div class="airing-item">
          <div class="airing-dot"></div>
          <span class="airing-title">${s.title.romaji}</span>
          <span class="airing-ep">${s.nextAiringEpisode ? 'ep ' + s.nextAiringEpisode.episode : '—'}</span>
        </div>
      `).join('');
    } catch(e) {
      document.getElementById('airingGrid').innerHTML = '<div class="loading-text">Could not load — check connection</div>';
      document.getElementById('seasonCount').textContent = 'AniList unavailable';
    }
  }

  fetchAiring();

  const notepad = document.getElementById('notepad');
  notepad.value = localStorage.getItem('satori-notes') || '';
  notepad.addEventListener('input', () => localStorage.setItem('satori-notes', notepad.value));

  const canvas = document.getElementById('petals');
  const ctx = canvas.getContext('2d');
  let petals = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function spawnPetal() {
    return {
      x: Math.random() * canvas.width,
      y: -20,
      size: Math.random() * 8 + 4,
      speed: Math.random() * 1.2 + 0.4,
      drift: Math.random() * 1.5 - 0.75,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      opacity: Math.random() * 0.5 + 0.2
    };
  }

  for (let i = 0; i < 18; i++) {
    const p = spawnPetal();
    p.y = Math.random() * canvas.height;
    petals.push(p);
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.opacity;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size * 0.6, p.size, 0, 0, Math.PI * 2);
    const col = isDark ? '#e8a0bf' : '#c0547e';
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
  }

  function animatePetals() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of petals) {
      p.y += p.speed;
      p.x += p.drift;
      p.rot += p.rotSpeed;
      if (p.y > canvas.height + 20) Object.assign(p, spawnPetal());
      drawPetal(p);
    }
    requestAnimationFrame(animatePetals);
  }
  animatePetals();
</script>
</body>
</html>
